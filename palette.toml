# Liquid Lambda palette. Every colour in the generated themes comes from these
# inputs: change a value, run `uv run lambda build`. The tuner
# (tuner/index.html) has a slider for each and copies this block back out.

[palette]
lead = "cyan"            # "cyan" or "amber": which colour carries buttons, selection, focus
tint = "warm"            # grey tint: "warm", "neutral" or "cool" (toward the cyan)
tint_strength = 55       # 0-100, how far the greys lean into the tint
second_loudness = 70     # 20-100, saturation of the colour that does not lead
cyan_hue = 212           # 180-235, OKLCH hue of the rim colour
amber_hue = 66           # 35-85, OKLCH hue of the core colour
lead_chroma = 100        # 40-100, saturation of the lead colour

[pin]
# Fix any base role by hand; aliases (link, hint, warn, ANSI) follow it.
# bg = "#141010"

[cursor]
# The cursor theme is built by `lambda apply` from vector cursor themes,
# recoloured to this palette. `base` provides every cursor; any role can be
# taken from another source instead: capitaine, bibata, simp1e. progress =
# "compose" draws the default arrow with the wait spinner.
base = "capitaine"
default = "bibata"       # the arrow
wait = "simp1e"          # busy, animated
progress = "compose"
size = 32                # px; 24 is the usual default, 32 and 48 render sharpest
