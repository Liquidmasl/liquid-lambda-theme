# Liquid Lambda colour scheme for WezTerm.
# Generated by `uv run lambda build` from templates/wezterm/Lambda.toml.j2. Do not edit.
# `lambda apply --only wezterm` links it into ~/.config/wezterm/colors/;
# select it with  config.color_scheme = 'Lambda'

[colors]
foreground = '#e4e0df'
background = '#140c0b'
cursor_bg = '#00dffe'
cursor_border = '#00dffe'
cursor_fg = '#160d0c'
compose_cursor = '#d19555'
selection_bg = '#294349'
selection_fg = '#e4e0df'
scrollbar_thumb = '#332927'
split = '#2f8d9f'
visual_bell = '#391d1a'
ansi = ['#261d1b', '#ef6661', '#88ca95', '#d19555', '#79a7e2', '#c88ec3', '#00dffe', '#bcb6b5']
brights = ['#756c6b', '#ff8a82', '#9ee1ab', '#ffb15d', '#97c1f7', '#dfa9da', '#99eeff', '#e4e0df']

[colors.tab_bar]
background = '#140c0b'
inactive_tab_edge = '#473d3c'

[colors.tab_bar.active_tab]
bg_color = '#261d1b'
fg_color = '#e4e0df'

[colors.tab_bar.inactive_tab]
bg_color = '#140c0b'
fg_color = '#928a89'

[colors.tab_bar.inactive_tab_hover]
bg_color = '#1d1312'
fg_color = '#bcb6b5'

[colors.tab_bar.new_tab]
bg_color = '#140c0b'
fg_color = '#928a89'

[colors.tab_bar.new_tab_hover]
bg_color = '#1d1312'
fg_color = '#00dffe'

[metadata]
name = 'Lambda'
origin_url = 'https://github.com/Liquidmasl/liquid-lambda-theme'
